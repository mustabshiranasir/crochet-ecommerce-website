<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts-Blingcute</title>
    <link rel="stylesheet" href="accounts.css">
    <!--Dancing script font-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <!--Lobster font, Roboto Slab, Merriweather-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lobster&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Adding navigation bar -->
    <script src="navigationbar.js"></script>
    <main>
        


        <section class="login_s4">
            <div class=" login_box">
                <h1 style="font-family:  sans-serif; font-weight: lighter;">Login</h1>
                <p>Please login using account detail bellow.</p>

                <div>
                    <input class="input_group" type="text" placeholder="Email">
                </div>
                <br><br>

                <div>
                    <input class="input_group" type="password" placeholder="Password">
                </div>
                <br><br>

                <div class="btn_row">
                    <button class="signin_btn">Sign In</button>

                    <a href="#" class="forgot_link">Forgot your password?</a>
                </div>
                <br>
                <a href="#" class="create_acc">Create account</a>
            </div>
        </section>
       



        <script src=" stickyNavBar.js">

        </script>

        <!-- Last section -->
        <script src="lastSection.js"></script>
    </main>

</body>

</html>
